# FND-FR-24: Dependabot version updates. It opens pull requests even though the
# project works on a single branch; the Product Owner merges or ignores them.
# Updates are grouped and capped so a week brings at most a few PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch bumps of every npm package arrive as one PR. Major
      # bumps stay separate (one PR each) because they need a human decision.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
