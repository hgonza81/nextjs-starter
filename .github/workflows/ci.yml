# FND-FR-23: continuous integration. Runs the same documented commands as local
# development (see the package.json scripts), so a green local run predicts a
# green CI run.
#
# Single working branch (main): the workflow runs on every push, no
# pull_request trigger. The deploy job (FND-T-24) runs only on main.
#
# Action versions are pinned to full commit SHAs (the comment names the
# release). Dependabot (.github/dependabot.yml) keeps them current.
name: CI

on: push

# A newer push to the same ref cancels the run still in progress, EXCEPT on
# main: cancelling a run cancels all of its jobs, which could kill the deploy
# job halfway through a production deployment. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: jobs only read the repository.
permissions:
  contents: read

env:
  # The three public variables are inlined at build time and validated by
  # next.config.ts (FND-T-49). They are placeholders, not secrets.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: replace-with-local-anon-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  # Group 1: no Docker. BLOCKING.
  fast:
    name: Fast checks (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from the packageManager field of package.json.
      # Node 26 ships without corepack, so pnpm is installed by this action.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # FND-FR-24: secret scan over the full history. BLOCKING. Uses the Gitleaks
  # binary (the gitleaks-action needs a license for organization accounts).
  # Rules and the single allowlist entry live in .gitleaks.toml. A secret that
  # reaches this job is already pushed: rotate it, removing it is not enough.
  secret-scan:
    name: Secret scan (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Verified against the official checksums file of the release, which is
      # pinned here so a tampered download or release asset fails the job.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
      # Exits non-zero when a leak is found. --redact keeps the secret out of
      # the public job log.
      - name: Scan the full git history
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" detect --source . --log-opts=--all
          --redact --verbose

  # FND-FR-24: dependency audit. INFORMATIONAL: findings are shown in the log
  # but never fail the run (continue-on-error). Decide on findings by hand.
  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads the lockfile; no install needed. Exits 1 when it finds anything.
      - run: pnpm audit

  # Group 2: Docker and local Supabase. BLOCKING. Independent of the fast job
  # (no `needs`) so both report in parallel.
  database-and-e2e:
    name: Database and E2E (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same value as .env.example; used by the schema drift check below.
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Playwright retries and the GitHub reporter key off this variable.
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only Postgres and the Kong gateway are needed so far: no test touches
      # Auth, Storage or Realtime. Kong stays because the FND-FR-08 test checks
      # that the gateway answers 503 for the disabled Data API (without it the
      # request is refused and the test fails). Remove services from this list
      # when an epic needs them.
      - name: Start local Supabase
        run: >-
          pnpm db:start
          -x gotrue,realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations and seed
        run: pnpm db:reset

      # FND-FR-07: the generated Drizzle schema must match the migrations.
      - name: Schema drift check
        run: |
          pnpm db:schema
          git diff --exit-code src/db

      # test:db is the only job that catches behavioural regressions in
      # tenant isolation (FND-T-19): it must stay blocking.
      - run: pnpm test:db

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # System dependencies are not cached, so they are installed every run.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

  # FND-FR-25: the ONLY deploy path to Vercel (Vercel's Git auto-deploy is off in
  # vercel.json). Runs on main only (a push of a tag or of another branch must
  # never deploy) and only when the three BLOCKING jobs passed. `audit` is
  # deliberately not in `needs`: it is informational and its findings must not
  # gate a deployment. A job runs when every job in `needs` succeeded; the
  # explicit success() below only documents that default.
  #
  # The deployed app has no database (ADR 0004): this job never sets
  # DATABASE_URL, DATABASE_MIGRATION_URL or a service-role key.
  deploy:
    name: Deploy to Vercel
    needs: [fast, database-and-e2e, secret-scan]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Own group with cancel off (the workflow-level group may cancel): two
    # deployments never run at once and a running one is never interrupted.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # Exact CLI version, run with `pnpm dlx` instead of a devDependency: a
      # devDependency would add ~235 packages to every install and audit, and
      # the project's minimum release age policy would need 17 exclusions for
      # a brand-new release. Trade-off: the CLI's own transitive dependencies
      # are not lockfile-pinned. Bump the version deliberately.
      VERCEL_CLI_VERSION: 65.15.0
    steps:
      # `secrets` cannot be used in `if:`, so the values are mapped to env and
      # tested here. Until the Product Owner creates all three secrets, the
      # job SKIPS (green, with a visible warning) instead of turning every
      # push red. Once they exist, every later failure fails the job.
      - name: Check Vercel secrets
        id: preflight
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::warning title=Deployment skipped::Vercel secrets missing:${missing}. Create them in the repository settings to enable deployment."
            echo "Deployment SKIPPED because secrets are missing:${missing}." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.preflight.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Each secret is exposed only to the steps that call the Vercel API.
      - name: Pull Vercel project settings
        if: steps.preflight.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production

      # Build time: the three NEXT_PUBLIC_* values come from the workflow-level
      # env (next.config.ts fails the build without them). They are placeholders
      # and no database variable is set.
      - name: Build
        if: steps.preflight.outputs.ready == 'true'
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod

      # Runtime: src/instrumentation.ts and next.config.ts validate the public
      # env when the server starts, so the same values are passed with -e. This
      # needs no action in the Vercel dashboard. NEXT_PUBLIC_APP_URL cannot be
      # the final deployment URL at build time, so the placeholder stays; the
      # real values replace these when a cloud Supabase project exists.
      # `--reporter=silent` keeps pnpm output off stdout: the CLI prints only
      # the deployment URL there.
      - name: Deploy prebuilt output
        id: deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(pnpm --reporter=silent dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod \
            -e "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            -e "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            -e "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}")"
          case "${url}" in
            https://*) ;;
            *) echo "::error::Unexpected deploy output, expected a URL."; exit 1 ;;
          esac
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${url}" >> "$GITHUB_STEP_SUMMARY"

      # Post-deploy hello-world check (FND-FR-25). `vercel curl` is used instead
      # of plain curl because Vercel's default Deployment Protection answers 401
      # on the unique deployment URL; it adds the bypass header itself using the
      # same token. No browser is needed, so Playwright is not installed.
      - name: Post-deploy health check
        if: steps.preflight.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          body_file="${RUNNER_TEMP}/health-body.json"
          for attempt in 1 2 3 4 5; do
            if pnpm --reporter=silent dlx "vercel@${VERCEL_CLI_VERSION}" curl \
              "${DEPLOYMENT_URL}/api/health" --yes \
              -- --fail --silent --show-error --output "${body_file}" \
              && [ "$(cat "${body_file}")" = '{"status":"ok"}' ]; then
              echo "Health check passed on attempt ${attempt}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt ${attempt} failed, retrying."
            sleep 5
          done
          echo "::error::Health check failed: ${DEPLOYMENT_URL}/api/health did not return 200 with the known body."
          exit 1
